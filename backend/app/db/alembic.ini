[alembic]
script_location = %(here)s/alembic
sqlalchemy.url = 
prepend_sys_path = %(here)s/../..
version_path_patterns = %%(rev)s_%%(slug)s
version_locations = %(here)s/alembic/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
name = sqlalchemy
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
name = alembic
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
