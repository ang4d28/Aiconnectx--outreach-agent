[project]
name = "ai-connectx-outreach-agent"
version = "0.1.0"
description = "University placement outreach automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[postgresql]>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "duckduckgo-search>=6.0",
    "selectolax>=0.3",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
