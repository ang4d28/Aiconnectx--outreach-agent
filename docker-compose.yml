name: aiconnectx

# Shared by backend and scheduler: one image, same config, same persistent folders.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: connectx-backend:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Inside Compose the services are reached by name, whatever .env says for local runs.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    SEARXNG_URL: http://searxng:8080
  volumes:
    # LinkedIn browser profile and Microsoft token cache survive rebuilds (gitignored).
    - ./secrets:/app/secrets
    # Google service-account JSON (gitignored).
    - ./creds:/app/creds:ro

services:
  postgres:
    image: postgres:16-alpine
    container_name: connectx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connectx}
      POSTGRES_USER: ${POSTGRES_USER:-connectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: connectx_searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - searxng_data:/etc/searxng
    ports:
      - "127.0.0.1:8080:8080"

  # API, dashboard backend and the WhatsApp webhook (/api/whatsapp/webhook).
  # Applies database migrations on start. Bound to localhost: reach it through the
  # Cloudflare Tunnel (webhook only) or an SSH tunnel (everything else).
  backend:
    <<: *app
    container_name: connectx_backend
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    command:
      - sh
      - -c
      - alembic -c app/db/alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Runs every job (python -m app.scheduler). Waits for the backend so migrations are done.
  scheduler:
    <<: *app
    container_name: connectx_scheduler
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      backend:
        condition: service_healthy
    init: true            # reaps Chromium child processes
    shm_size: "1gb"       # Chromium needs more than the 64 MB default
    stop_grace_period: 30s

  # Landing page and dashboard (nginx serving the Vite build). Enable with: docker compose --profile frontend up -d
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
    container_name: connectx_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"     # public landing page (what the tunnel points at)
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8081"  # operator dashboard, private (SSH tunnel only)

  # Cloudflare Tunnel for the WhatsApp webhook. Enable with: docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: connectx_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  searxng_data:
